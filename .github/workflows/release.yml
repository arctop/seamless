name: Release

# Cut a release in three steps. On the owner's Mac, scripts/release/macos.sh
# builds the darwin binaries and the Touch ID approver, signs them with the
# project's Developer ID Application certificate, has Apple notarize them,
# uploads them to the tag's draft release, and writes the SSH-signed tag whose
# message carries their sha256 manifest; the owner pushes the tag. This
# workflow's goreleaser job then waits for the owner's approval of its
# `release` environment, holds the draft's darwin assets to the tag's
# manifest, cross-compiles linux and windows (.goreleaser.yaml), and fills the
# draft with the Sigstore-signed checksums, installer bundles and changelog --
# leaving it a draft. The owner then signs the draft's checksums.txt with a
# hardware key (scripts/release/sign.sh, which uploads checksums.txt.sshsig)
# and approves the publish job, which publishes the draft only once that
# signature verifies against the repository's release_signers (releasekit
# verify-owner: a key at both the previous release's tag and this one), then
# re-verifies the published signatures against this tag's exact identity.
# Once that passes, the mcp-registry job publishes server.json to the MCP
# registry (mcp-registry.yml), and the pages job publishes the site,
# installers included, from this tag (pages.yml). The Homebrew cask is pushed
# by the owner afterwards (scripts/release/cask.sh). No step reads a secret
# but the GITHUB_TOKEN; scripts/release/README.md has the steps.
#
# What the publish job's check is worth: this file is read from the tag being
# released, so whoever can push a v* tag can push a commit whose release.yml
# skips the check. The gate keeps the release path honest -- no release
# publishes without the owner's signature, and a key added in a release cannot
# sign it -- but the guarantees against a hostile tag pusher are the clients':
# an updater pinned with update.release_signers, and the installers' embedded
# keys, verify checksums.txt.sshsig themselves.

on:
  push:
    tags: ["v*"]

permissions:
  # contents: write publishes the release; id-token: write mints the short-lived
  # OIDC token cosign exchanges for a keyless signing certificate, which is what
  # binds checksums.txt to this workflow in this repo (audit M3). Without it,
  # `cosign sign-blob` would fall back to an interactive browser flow and hang.
  contents: write
  id-token: write

# Third-party actions are pinned to full commit SHAs, not mutable major tags.
# This job holds `contents: write` and the release GITHUB_TOKEN, so a retagged
# or compromised upstream action would run in the context that builds and
# publishes what every user downloads. The trailing comment is the human-
# readable version; dependabot (.github/dependabot.yml) bumps both together.
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The owner approves every release here (F, plan
    # agent-accounts-and-releases): the environment's required reviewer is
    # the owner, it admits only v* tags, and admins cannot bypass it. It holds
    # no secret; what it guards is this job's GITHUB_TOKEN and its OIDC
    # identity, which sign checksums.txt and fill the draft. An environment
    # changes neither the Sigstore certificate's identity
    # (release.yml@refs/tags/vX.Y.Z, its job_workflow_ref) nor anything a
    # verifier pins. A fork's release creates its own, unprotected one. The
    # publish job below waits for a second approval, after the owner signs.
    environment: release
    timeout-minutes: 30
    steps:
      # Full history: the changelog is built from the commits since the
      # previous tag, which a shallow checkout cannot see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The macOS assets: both darwin archives and the Touch ID approver,
      # which scripts/release/macos.sh built, signed and notarized on the
      # owner's Mac and uploaded to this tag's draft release. They are
      # downloaded the way macos.sh read them back, held to the sha256
      # manifest in the signed tag's message (only an admin may push a v* tag,
      # so the manifest is the owner's), and handed to goreleaser as
      # DARWIN_ASSETS: checksum.extra_files lists them in checksums.txt, which
      # cosign signs, and the draft already holds them, so the published
      # release has one copy of each. Any mismatch, missing or extra asset
      # stops the release here (releasekit check-darwin; its tests are the
      # fixtures), before anything below signs into the public Rekor log. The
      # tag is fetched again because a checkout can leave a lightweight copy
      # of it without the message.
      #
      # A fork: with no manifest in its tag, its release has no darwin
      # archives (DARWIN_ASSETS stays unset); with one (macos.sh --adhoc), it
      # is checked the same way.
      - name: Check the macOS assets against the tag's manifest
        env:
          GH_TOKEN: ${{ github.token }}
          # The ref reaches the script through env:, never as an expression
          # inside run:, so no tag text is spliced into shell source.
          TAG_REF: ${{ github.ref }}
          CANONICAL: ${{ github.repository == 'arctop/seamless' }}
        run: |
          set -eu
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::the release needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          tag=${TAG_REF#refs/tags/}
          git fetch --force --quiet origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "::error::$tag is not an annotated tag: scripts/release/macos.sh writes a signed one carrying the macOS manifest"
            exit 1
          fi
          git cat-file tag "$tag" > "$RUNNER_TEMP/tag-object.txt"
          if [ "$CANONICAL" != true ] && ! grep -Eq '^[0-9a-f]{64}  ' "$RUNNER_TEMP/tag-object.txt"; then
            echo "::notice::the tag carries no macOS manifest: this fork's release has no darwin archives"
            exit 0
          fi
          scripts/release/fetch-draft.sh "$tag" "$RUNNER_TEMP/darwin"
          go run ./cmd/releasekit check-darwin -tag "$tag" \
            -tag-object "$RUNNER_TEMP/tag-object.txt" -assets "$RUNNER_TEMP/darwin"
          echo "DARWIN_ASSETS=$RUNNER_TEMP/darwin/*" >> "$GITHUB_ENV"

      # goreleaser's `signs:` stage, the installer-signing step and the
      # post-release verify below all shell out to this binary. The version is
      # pinned to the v2 line: the action's default (cosign v3) deprecates the
      # detached .sig/.pem outputs and by default writes only a bundle, so it
      # would not produce the pair the checksum-detached entry in
      # .goreleaser.yaml writes for checksums.txt and that docs/install +
      # docs/install.ps1 verify. v2 writes the same bundle format v3 does when
      # given --new-bundle-format, which is how the installer scripts and
      # checksums.txt (the checksum-bundle entry) are signed. Lifting this pin
      # means dropping the detached pair, and that first needs both installers
      # to verify checksums.txt.sigstore.json instead: an installer that finds
      # no pair falls back to checksum-only with a warning, so dropping it
      # early would quietly weaken verification.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"

      # Sign the two canonical installer scripts as Sigstore bundles (protobuf
      # bundle format: signature + Fulcio certificate + Rekor entry in one
      # self-contained JSON). goreleaser publishes the scripts and bundles as
      # release assets (release.extra_files in .goreleaser.yaml), where
      # `seamlessd update` fetches both and verifies with its compiled-in
      # sigstore-go verifier before piping the script to a shell (audit M3).
      # The verify-blob calls re-check each bundle against the identity pattern
      # the daemon pins (a v* tag of this repository's release workflow; the
      # installers accept it too), so a format or identity regression fails
      # the release here rather than on users' machines.
      - name: Sign installer scripts (keyless)
        run: |
          mkdir -p sigs
          for script in install install.ps1; do
            cosign sign-blob --yes --new-bundle-format=true \
              --bundle "sigs/${script}.sigstore.json" "docs/${script}"
            cosign verify-blob \
              --bundle "sigs/${script}.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/arctop/seamless/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "docs/${script}"
          done

      # Fills the draft macos.sh made (release.use_existing_draft), which it
      # finds by its title, the tag, and leaves it a draft (release.draft): the
      # publish job below publishes it. A tag pushed with no draft fails the
      # check above first.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the draft once the owner has signed it (plan
  # agent-accounts-and-releases, step D). This job waits for the owner's
  # approval of the `release` environment a second time: while it waits, the
  # owner runs scripts/release/sign.sh vX.Y.Z on their own machine, which
  # holds the draft's checksums.txt to its Sigstore bundle for this tag and
  # its darwin lines to the tag's manifest, signs it with a hardware key
  # (ssh-keygen -Y sign -n seamless-release), and uploads checksums.txt.sshsig
  # to the draft. Approved, the job holds that signature to release_signers
  # as the previous release's tag and this tag both list it (releasekit
  # verify-owner), and only then publishes. Approved before the signature is
  # there, it fails, the draft stays a draft, and "Re-run failed jobs" asks for
  # the approval again.
  #
  # A fork's release is not held to the owner's signature (its keys are not
  # the owner's): with CANONICAL false the job publishes at once, and the
  # fork's own release environment, created unprotected, does not wait.
  publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Full history and every tag: release_signers is read at the previous
      # release's tag as well as this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The same cosign as the goreleaser job, for the post-publish verify.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"

      # The draft's checksums.txt and the owner's signature over it, held to
      # release_signers at the previous release's tag and at this one: a key
      # must be in both, so a key added in this release cannot sign it. The
      # first signed release (the previous tag has no release_signers) is the
      # bootstrap, which this tag's file alone decides, loudly (see
      # scripts/release/README.md). -require refuses a tag with no
      # release_signers at either: on this repository every release is signed.
      - name: Check the owner's signature
        env:
          GH_TOKEN: ${{ github.token }}
          # The ref reaches the script through env:, never as an expression
          # inside run:, so no tag text is spliced into shell source.
          TAG_REF: ${{ github.ref }}
          CANONICAL: ${{ github.repository == 'arctop/seamless' }}
        run: |
          set -eu
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::the release needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          tag=${TAG_REF#refs/tags/}
          if [ "$CANONICAL" != true ]; then
            echo "::notice::a fork's release is not held to the owner's signature; publishing"
            exit 0
          fi
          scripts/release/fetch-draft.sh "$tag" "$RUNNER_TEMP/owner" "$GITHUB_REPOSITORY" checksums.txt checksums.txt.sshsig
          go run ./cmd/releasekit verify-owner -require -tag "$tag" \
            -checksums "$RUNNER_TEMP/owner/checksums.txt" -sig "$RUNNER_TEMP/owner/checksums.txt.sshsig"

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref }}
        run: |
          set -eu
          tag=${TAG_REF#refs/tags/}
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

      # Post-release verify. goreleaser signed checksums.txt twice (the two
      # `signs:` entries in .goreleaser.yaml), and the owner once; fetch it
      # and every signature back from the published release, by the URLs and
      # names verifiers download. Each Sigstore signature is checked against
      # THIS tag's exact signing identity (repository, workflow file and ref
      # compared whole, unlike the v* pattern above), so a signed
      # checksums.txt from any other release fails. It also fails on a
      # signature missing from the release, or one over the wrong bytes: the
      # two entries run concurrently, and each rewrites checksums.txt (same
      # bytes) just before it signs. The owner's signature is checked again on
      # the published bytes, as the updater and the installers will read them.
      #
      # This runs after the release is published, so a red result cannot stop
      # the release. Rule out a network failure first -- the same commands
      # give the same verdict from any machine -- then pull the release: mark
      # it prerelease, which is the yank (the update check and /releases/latest
      # both skip prereleases), and do not push its cask (scripts/release/
      # cask.sh refuses a prerelease; revert the tap's commit if it was already
      # pushed), then fix the cause and cut a new patch tag.
      - name: Verify published checksums signatures (exact tag identity)
        env:
          # The ref reaches the script through env:, never as an expression
          # inside run:, so no tag text is spliced into shell source.
          TAG_REF: ${{ github.ref }}
          CANONICAL: ${{ github.repository == 'arctop/seamless' }}
        run: |
          set -eu
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release verify needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          # The identity is spelled out, not derived from the repository that
          # ran this: it is the signer verifiers pin. The download base is the
          # release this run just published.
          identity="https://github.com/arctop/seamless/.github/workflows/release.yml@$TAG_REF"
          issuer=https://token.actions.githubusercontent.com
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${TAG_REF#refs/tags/}"
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir"
          assets="checksums.txt checksums.txt.sigstore.json checksums.txt.sig checksums.txt.pem"
          if [ "$CANONICAL" = true ]; then
            assets="$assets checksums.txt.sshsig"
          fi
          for asset in $assets; do
            curl -fsSL --retry 5 --retry-all-errors -o "$dir/$asset" "$base/$asset"
          done
          cosign verify-blob \
            --bundle "$dir/checksums.txt.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$dir/checksums.txt"
          cosign verify-blob \
            --signature "$dir/checksums.txt.sig" \
            --certificate "$dir/checksums.txt.pem" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$dir/checksums.txt"
          if [ "$CANONICAL" = true ]; then
            go run ./cmd/releasekit verify-owner -require -tag "${TAG_REF#refs/tags/}" \
              -checksums "$dir/checksums.txt" -sig "$dir/checksums.txt.sshsig"
          fi

  # Publish this version to the MCP registry, only after the publish job has
  # published the release and verified its signatures: a release that fails
  # that verify is being yanked and must not be listed. It holds only the OIDC
  # token the registry login needs, not this workflow's contents: write. A
  # failure here leaves the release itself intact; fix the cause and run
  # `gh workflow run mcp-registry.yml -f tag=<tag>`.
  mcp-registry:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}

  # Publish the site from this tag, once the release is published and its
  # signatures verified: the installers it serves are then the ones this
  # release signed. A prerelease (a tag with a suffix, v0.9.0-rc.1) leaves
  # the site as it was, like the update check and /releases/latest. A
  # failure leaves the release intact; the next site-* tag or release
  # publishes the site.
  pages:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
