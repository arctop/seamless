name: Release

# Cut a release by pushing a version tag: `git tag v0.3.0 && git push origin
# v0.3.0`. goreleaser cross-compiles seamlessd + seam (see .goreleaser.yaml)
# and publishes the cross-platform archives (binaries plus maintained
# Claude Code/Codex skills), signed checksums, installer bundles, and changelog
# as a GitHub release; the last step re-verifies the published checksums
# signatures against this tag's exact signing identity. Once that passes, the
# mcp-registry job publishes server.json to the MCP registry
# (mcp-registry.yml).
on:
  push:
    tags: ["v*"]

permissions:
  # contents: write publishes the release; id-token: write mints the short-lived
  # OIDC token cosign exchanges for a keyless signing certificate, which is what
  # binds checksums.txt to this workflow in this repo (audit M3). Without it,
  # `cosign sign-blob` would fall back to an interactive browser flow and hang.
  contents: write
  id-token: write

# Third-party actions are pinned to full commit SHAs, not mutable major tags.
# This job holds `contents: write` and the release GITHUB_TOKEN, so a retagged
# or compromised upstream action would run in the context that builds and
# publishes what every user downloads. The trailing comment is the human-
# readable version; dependabot (.github/dependabot.yml) bumps both together.
jobs:
  # The macOS Touch ID approver (macos/SeamApprove) ships as its own opt-in
  # release asset, seamless-approve_<version>_darwin.zip, which only
  # `seam touchid enroll` downloads; no install path uses it unasked. It needs
  # one secret beyond the darwin signing ones: MACOS_APPROVER_PROFILE, the
  # base64 of the Developer ID provisioning profile for the App ID
  # org.thereisnospoon.seamless.approve (Keychain Sharing on). Without it --
  # a fork, or this repo before the owner adds it -- the approver job is
  # skipped and goreleaser publishes exactly what it did before: APPROVER_ZIP
  # stays unset and the .goreleaser.yaml entries for it render empty.
  #
  # This gate runs on Linux so a release without the profile never waits for
  # a macOS runner. A profile with a darwin signing secret missing is a
  # half-configured release and fails here.
  approver-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Decide whether to build the Touch ID approver
        id: gate
        env:
          MACOS_APPROVER_PROFILE: ${{ secrets.MACOS_APPROVER_PROFILE }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          if [ -z "$MACOS_APPROVER_PROFILE" ]; then
            echo "::notice::MACOS_APPROVER_PROFILE is not set: this release ships without the Touch ID approver"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::MACOS_APPROVER_PROFILE is set, but signing the Touch ID approver also needs:$missing"
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  # Build, sign, notarize and staple the approver, then zip it for goreleaser
  # (scripts/approver/build.sh and notarize.sh; `make approver` is the same
  # build unsigned). It signs with the same Developer ID certificate as the
  # darwin binaries (MACOS_SIGN_P12), so the app's team identifier is theirs,
  # which `seam touchid enroll` checks. The team id is read from the profile
  # and, like the identity's hash, masked before first use: neither is in the
  # source, and neither reaches the log.
  approver:
    needs: approver-gate
    if: needs.approver-gate.outputs.build == 'true'
    runs-on: macos-latest
    # Apple's notary service usually answers in minutes; notarize.sh waits up
    # to 20.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, sign and notarize the Touch ID approver
        env:
          TAG_REF: ${{ github.ref }}
          MACOS_APPROVER_PROFILE: ${{ secrets.MACOS_APPROVER_PROFILE }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -eu
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::the approver build needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          # The version as goreleaser spells it (.Version: the tag without its v).
          version=${TAG_REF#refs/tags/v}
          work="$RUNNER_TEMP/approver"
          mkdir -p "$work/dist"

          # The provisioning profile, and the team id it was issued to.
          printf '%s' "$MACOS_APPROVER_PROFILE" | base64 --decode > "$work/approver.provisionprofile"
          security cms -D -i "$work/approver.provisionprofile" > "$work/profile.plist"
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$work/profile.plist")
          echo "::add-mask::$team"

          # A throwaway keychain holding only the Developer ID certificate,
          # first in the search list so codesign finds it; removed below.
          keychain="$work/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          echo "::add-mask::$kc_pass"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$work/sign.p12"
          security import "$work/sign.p12" -k "$keychain" -f pkcs12 -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$work/sign.p12"
          # Apple's Developer ID G2 intermediate, which issued the signing
          # certificate. A P12 exported without its chain leaves find-identity
          # with no valid identity on a runner that lacks it, so it is
          # imported up front, pinned (owner, 2026-11-06). The hash is what
          # apple.com/certificateauthority served on 2026-11-06, equal to the
          # copy Xcode installs; the certificate is valid to 2031-09-17.
          ca="$work/DeveloperIDG2CA.cer"
          curl -fsSL --proto '=https' --retry 3 -o "$ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          ca_sha=$(shasum -a 256 "$ca" | awk '{ print $1 }')
          if [ "$ca_sha" != f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a ]; then
            echo "::error::DeveloperIDG2CA.cer from apple.com has SHA-256 $ca_sha, not the pinned one"
            exit 1
          fi
          # The P12 may carry it already.
          if ! out=$(security import "$ca" -k "$keychain" 2>&1); then
            case $out in
              *"already exists"*) ;;
              *) echo "$out"; exit 1 ;;
            esac
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing search list, one word per keychain
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_SIGN_P12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "::add-mask::$identity"

          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$work/notary.p8"

          APPROVER_SIGN_IDENTITY=$identity APPROVER_TEAM_ID=$team \
            APPROVER_PROFILE="$work/approver.provisionprofile" \
            APPROVER_VERSION=$version APPROVER_OUT="$work/out" \
            scripts/approver/build.sh
          APPROVER_NOTARY_KEY="$work/notary.p8" \
            APPROVER_NOTARY_KEY_ID=$MACOS_NOTARY_KEY_ID APPROVER_NOTARY_ISSUER_ID=$MACOS_NOTARY_ISSUER_ID \
            APPROVER_ZIP="$work/dist/seamless-approve_${version}_darwin.zip" \
            scripts/approver/notarize.sh "$work/out/Seamless Approve.app"

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          work="$RUNNER_TEMP/approver"
          security delete-keychain "$work/signing.keychain-db" 2>/dev/null || true
          rm -f "$work/sign.p12" "$work/notary.p8" "$work/approver.provisionprofile" "$work/profile.plist"

      # Zipped again by the artifact store, unzipped by download-artifact in
      # the goreleaser job: the release asset is the inner zip, byte for byte.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approver
          path: ${{ runner.temp }}/approver/dist/
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    # After the approver: a release that built one waits for it, one that did
    # not (the job skipped) goes ahead as before. A failed approver build
    # stops the release, like a failed signing step would.
    needs: [approver-gate, approver]
    if: ${{ !cancelled() && needs.approver-gate.result == 'success' && (needs.approver.result == 'success' || needs.approver.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Apple notarizes each of the four darwin binaries (`notarize:` in
    # .goreleaser.yaml) and goreleaser waits for every verdict; that usually
    # takes minutes but can take far longer, so 15 was too tight.
    timeout-minutes: 45
    steps:
      # Full history: the changelog is built from the commits since the
      # previous tag, which a shallow checkout cannot see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # This repo's releases are Developer ID-signed and notarized. A missing
      # secret would make goreleaser skip that step and quietly publish
      # adhoc-signed darwin binaries, bringing back the macOS Background Items
      # notice on every update, so the release stops here instead -- before the
      # installer scripts are signed into Rekor below. Forks have no such
      # secrets and build unsigned, as before.
      - name: Require the macOS signing secrets
        if: github.repository == 'arctop/seamless'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          missing=
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS signing secrets not set:$missing"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # goreleaser's `signs:` stage, the installer-signing step and the
      # post-release verify below all shell out to this binary. The version is
      # pinned to the v2 line: the action's default (cosign v3) deprecates the
      # detached .sig/.pem outputs and by default writes only a bundle, so it
      # would not produce the pair the checksum-detached entry in
      # .goreleaser.yaml writes for checksums.txt and that docs/install +
      # docs/install.ps1 verify. v2 writes the same bundle format v3 does when
      # given --new-bundle-format, which is how the installer scripts and
      # checksums.txt (the checksum-bundle entry) are signed. Lifting this pin
      # means dropping the detached pair, and that first needs both installers
      # to verify checksums.txt.sigstore.json instead: an installer that finds
      # no pair falls back to checksum-only with a warning, so dropping it
      # early would quietly weaken verification.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"

      # Sign the two canonical installer scripts as Sigstore bundles (protobuf
      # bundle format: signature + Fulcio certificate + Rekor entry in one
      # self-contained JSON). goreleaser publishes the scripts and bundles as
      # release assets (release.extra_files in .goreleaser.yaml), where
      # `seamlessd update` fetches both and verifies with its compiled-in
      # sigstore-go verifier before piping the script to a shell (audit M3).
      # The verify-blob calls re-check each bundle against the identity pattern
      # the daemon pins (a v* tag of this repository's release workflow; the
      # installers accept it too), so a format or identity regression fails
      # the release here rather than on users' machines.
      - name: Sign installer scripts (keyless)
        run: |
          mkdir -p sigs
          for script in install install.ps1; do
            cosign sign-blob --yes --new-bundle-format=true \
              --bundle "sigs/${script}.sigstore.json" "docs/${script}"
            cosign verify-blob \
              --bundle "sigs/${script}.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/arctop/seamless/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "docs/${script}"
          done

      # The Touch ID approver, when the approver job built one. It lands
      # outside the checkout (goreleaser refuses a dirty tree), and
      # APPROVER_ZIP hands its path to the two .goreleaser.yaml entries that
      # list it in checksums.txt and upload it. When the job was skipped,
      # neither step runs and APPROVER_ZIP stays unset.
      - name: Fetch the Touch ID approver
        if: needs.approver.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approver
          path: ${{ runner.temp }}/approver

      - name: Hand the Touch ID approver to goreleaser
        if: needs.approver.result == 'success'
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          zip="$RUNNER_TEMP/approver/seamless-approve_${TAG_REF#refs/tags/v}_darwin.zip"
          if [ ! -f "$zip" ]; then
            echo "::error::the approver artifact holds no $(basename "$zip")"
            ls -la "$RUNNER_TEMP/approver" || true
            exit 1
          fi
          set -- "$RUNNER_TEMP"/approver/*
          if [ "$#" -ne 1 ]; then
            echo "::error::the approver artifact holds $# files, not one"
            exit 1
          fi
          echo "APPROVER_ZIP=$zip" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to arctop/homebrew-tap (`homebrew_casks:`
          # in .goreleaser.yaml). GITHUB_TOKEN cannot cross repos, so this is a
          # fine-grained PAT with contents:write on that single repo -- keep it
          # that narrow; this job builds what every user downloads.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Developer ID signing + notarization of the darwin binaries
          # (`notarize:` in .goreleaser.yaml): the .p12 (certificate + key) in
          # base64 and its password, and an App Store Connect API key (issuer,
          # key id, the .p8 in base64) for notarytool.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Post-release verify. goreleaser signed checksums.txt twice (the two
      # `signs:` entries in .goreleaser.yaml); fetch it and both signatures
      # back from the published release, by the URLs and names verifiers
      # download, and check each against THIS tag's exact signing identity
      # (repository, workflow file and ref compared whole, unlike the v*
      # pattern above), so a signed checksums.txt from any other release
      # fails. It also fails on a signature missing from the release, or one
      # over the wrong bytes: the two entries run concurrently, and each
      # rewrites checksums.txt (same bytes) just before it signs.
      #
      # This runs after goreleaser has published the release (and, for a
      # non-prerelease tag, pushed the cask), so a red result cannot stop the
      # release. Rule out a network failure first -- the same two cosign
      # commands give the same verdict from any machine -- then pull the
      # release: mark it prerelease, which is the yank (the update check and
      # /releases/latest both skip prereleases), revert the cask commit in
      # arctop/homebrew-tap, then fix the cause and cut a new patch tag.
      - name: Verify published checksums signatures (exact tag identity)
        env:
          # The ref reaches the script through env:, never as an expression
          # inside run:, so no tag text is spliced into shell source.
          TAG_REF: ${{ github.ref }}
        run: |
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release verify needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          # The identity is spelled out, not derived from the repository that
          # ran this: it is the signer verifiers pin. The download base is the
          # release this run just published.
          identity="https://github.com/arctop/seamless/.github/workflows/release.yml@$TAG_REF"
          issuer=https://token.actions.githubusercontent.com
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${TAG_REF#refs/tags/}"
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir"
          for asset in checksums.txt checksums.txt.sigstore.json checksums.txt.sig checksums.txt.pem; do
            curl -fsSL --retry 5 --retry-all-errors -o "$dir/$asset" "$base/$asset"
          done
          cosign verify-blob \
            --bundle "$dir/checksums.txt.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$dir/checksums.txt"
          cosign verify-blob \
            --signature "$dir/checksums.txt.sig" \
            --certificate "$dir/checksums.txt.pem" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$dir/checksums.txt"

  # Publish this version to the MCP registry, only after the release above is
  # published and its signatures verified: a release that fails that verify is
  # being yanked and must not be listed. It holds only the OIDC token the
  # registry login needs, not this workflow's contents: write. A failure here
  # leaves the release itself intact; fix the cause and run
  # `gh workflow run mcp-registry.yml -f tag=<tag>`.
  mcp-registry:
    needs: goreleaser
    # Said explicitly: the default success() also looks past goreleaser to
    # the jobs it needs, and a skipped approver job would then skip this one.
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}
