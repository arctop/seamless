name: Release

# Cut a release in two halves. On the owner's Mac, scripts/release/macos.sh
# builds the darwin binaries and the Touch ID approver, signs them with the
# project's Developer ID Application certificate, has Apple notarize them,
# uploads them to the tag's draft release, and writes the SSH-signed tag whose
# message carries their sha256 manifest; the owner pushes the tag. This
# workflow then waits for the owner's approval of its `release` environment,
# holds the draft's darwin assets to the tag's manifest, cross-compiles
# linux and windows (.goreleaser.yaml), and publishes the draft with the
# signed checksums, installer bundles and changelog; the last step
# re-verifies the published checksums signatures against this tag's exact
# signing identity. Once that passes, the mcp-registry job publishes
# server.json to the MCP registry (mcp-registry.yml). The Homebrew cask is
# pushed by the owner afterwards (scripts/release/cask.sh). No step reads a
# secret but the GITHUB_TOKEN; scripts/release/README.md has the steps.
on:
  push:
    tags: ["v*"]

permissions:
  # contents: write publishes the release; id-token: write mints the short-lived
  # OIDC token cosign exchanges for a keyless signing certificate, which is what
  # binds checksums.txt to this workflow in this repo (audit M3). Without it,
  # `cosign sign-blob` would fall back to an interactive browser flow and hang.
  contents: write
  id-token: write

# Third-party actions are pinned to full commit SHAs, not mutable major tags.
# This job holds `contents: write` and the release GITHUB_TOKEN, so a retagged
# or compromised upstream action would run in the context that builds and
# publishes what every user downloads. The trailing comment is the human-
# readable version; dependabot (.github/dependabot.yml) bumps both together.
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The owner approves every release here (F, plan
    # agent-accounts-and-releases): the environment's required reviewer is
    # the owner, it admits only v* tags, and admins cannot bypass it. It holds
    # no secret; what it guards is this job's GITHUB_TOKEN and its OIDC
    # identity, which sign checksums.txt and publish. An environment changes
    # neither the Sigstore certificate's identity
    # (release.yml@refs/tags/vX.Y.Z, its job_workflow_ref) nor anything a
    # verifier pins. A fork's release creates its own, unprotected one.
    environment: release
    timeout-minutes: 30
    steps:
      # Full history: the changelog is built from the commits since the
      # previous tag, which a shallow checkout cannot see.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The macOS assets: both darwin archives and the Touch ID approver,
      # which scripts/release/macos.sh built, signed and notarized on the
      # owner's Mac and uploaded to this tag's draft release. They are
      # downloaded the way macos.sh read them back, held to the sha256
      # manifest in the signed tag's message (only an admin may push a v* tag,
      # so the manifest is the owner's), and handed to goreleaser as
      # DARWIN_ASSETS: checksum.extra_files lists them in checksums.txt, which
      # cosign signs, and the draft already holds them, so the published
      # release has one copy of each. Any mismatch, missing or extra asset
      # stops the release here (releasekit check-darwin; its tests are the
      # fixtures), before anything below signs into the public Rekor log. The
      # tag is fetched again because a checkout can leave a lightweight copy
      # of it without the message.
      #
      # A fork: with no manifest in its tag, its release has no darwin
      # archives (DARWIN_ASSETS stays unset); with one (macos.sh --adhoc), it
      # is checked the same way.
      - name: Check the macOS assets against the tag's manifest
        env:
          GH_TOKEN: ${{ github.token }}
          # The ref reaches the script through env:, never as an expression
          # inside run:, so no tag text is spliced into shell source.
          TAG_REF: ${{ github.ref }}
          CANONICAL: ${{ github.repository == 'arctop/seamless' }}
        run: |
          set -eu
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::the release needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          tag=${TAG_REF#refs/tags/}
          git fetch --force --quiet origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "::error::$tag is not an annotated tag: scripts/release/macos.sh writes a signed one carrying the macOS manifest"
            exit 1
          fi
          git cat-file tag "$tag" > "$RUNNER_TEMP/tag-object.txt"
          if [ "$CANONICAL" != true ] && ! grep -Eq '^[0-9a-f]{64}  ' "$RUNNER_TEMP/tag-object.txt"; then
            echo "::notice::the tag carries no macOS manifest: this fork's release has no darwin archives"
            exit 0
          fi
          scripts/release/fetch-draft.sh "$tag" "$RUNNER_TEMP/darwin"
          go run ./cmd/releasekit check-darwin -tag "$tag" \
            -tag-object "$RUNNER_TEMP/tag-object.txt" -assets "$RUNNER_TEMP/darwin"
          echo "DARWIN_ASSETS=$RUNNER_TEMP/darwin/*" >> "$GITHUB_ENV"

      # goreleaser's `signs:` stage, the installer-signing step and the
      # post-release verify below all shell out to this binary. The version is
      # pinned to the v2 line: the action's default (cosign v3) deprecates the
      # detached .sig/.pem outputs and by default writes only a bundle, so it
      # would not produce the pair the checksum-detached entry in
      # .goreleaser.yaml writes for checksums.txt and that docs/install +
      # docs/install.ps1 verify. v2 writes the same bundle format v3 does when
      # given --new-bundle-format, which is how the installer scripts and
      # checksums.txt (the checksum-bundle entry) are signed. Lifting this pin
      # means dropping the detached pair, and that first needs both installers
      # to verify checksums.txt.sigstore.json instead: an installer that finds
      # no pair falls back to checksum-only with a warning, so dropping it
      # early would quietly weaken verification.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.4"

      # Sign the two canonical installer scripts as Sigstore bundles (protobuf
      # bundle format: signature + Fulcio certificate + Rekor entry in one
      # self-contained JSON). goreleaser publishes the scripts and bundles as
      # release assets (release.extra_files in .goreleaser.yaml), where
      # `seamlessd update` fetches both and verifies with its compiled-in
      # sigstore-go verifier before piping the script to a shell (audit M3).
      # The verify-blob calls re-check each bundle against the identity pattern
      # the daemon pins (a v* tag of this repository's release workflow; the
      # installers accept it too), so a format or identity regression fails
      # the release here rather than on users' machines.
      - name: Sign installer scripts (keyless)
        run: |
          mkdir -p sigs
          for script in install install.ps1; do
            cosign sign-blob --yes --new-bundle-format=true \
              --bundle "sigs/${script}.sigstore.json" "docs/${script}"
            cosign verify-blob \
              --bundle "sigs/${script}.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/arctop/seamless/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "docs/${script}"
          done

      # Publishes the draft macos.sh made (release.use_existing_draft), which
      # it finds by its title, the tag. A tag pushed with no draft fails the
      # check above first.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Post-release verify. goreleaser signed checksums.txt twice (the two
      # `signs:` entries in .goreleaser.yaml); fetch it and both signatures
      # back from the published release, by the URLs and names verifiers
      # download, and check each against THIS tag's exact signing identity
      # (repository, workflow file and ref compared whole, unlike the v*
      # pattern above), so a signed checksums.txt from any other release
      # fails. It also fails on a signature missing from the release, or one
      # over the wrong bytes: the two entries run concurrently, and each
      # rewrites checksums.txt (same bytes) just before it signs.
      #
      # This runs after goreleaser has published the release, so a red result
      # cannot stop the release. Rule out a network failure first -- the same
      # two cosign commands give the same verdict from any machine -- then
      # pull the release: mark it prerelease, which is the yank (the update
      # check and /releases/latest both skip prereleases), and do not push
      # its cask (scripts/release/cask.sh refuses a prerelease; revert the
      # tap's commit if it was already pushed), then fix the cause and cut a
      # new patch tag.
      - name: Verify published checksums signatures (exact tag identity)
        env:
          # The ref reaches the script through env:, never as an expression
          # inside run:, so no tag text is spliced into shell source.
          TAG_REF: ${{ github.ref }}
        run: |
          case "$TAG_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release verify needs a v* tag ref, got $TAG_REF"; exit 1 ;;
          esac
          # The identity is spelled out, not derived from the repository that
          # ran this: it is the signer verifiers pin. The download base is the
          # release this run just published.
          identity="https://github.com/arctop/seamless/.github/workflows/release.yml@$TAG_REF"
          issuer=https://token.actions.githubusercontent.com
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${TAG_REF#refs/tags/}"
          dir="$RUNNER_TEMP/published"
          mkdir -p "$dir"
          for asset in checksums.txt checksums.txt.sigstore.json checksums.txt.sig checksums.txt.pem; do
            curl -fsSL --retry 5 --retry-all-errors -o "$dir/$asset" "$base/$asset"
          done
          cosign verify-blob \
            --bundle "$dir/checksums.txt.sigstore.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$dir/checksums.txt"
          cosign verify-blob \
            --signature "$dir/checksums.txt.sig" \
            --certificate "$dir/checksums.txt.pem" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            "$dir/checksums.txt"

  # Publish this version to the MCP registry, only after the release above is
  # published and its signatures verified: a release that fails that verify is
  # being yanked and must not be listed. It holds only the OIDC token the
  # registry login needs, not this workflow's contents: write. A failure here
  # leaves the release itself intact; fix the cause and run
  # `gh workflow run mcp-registry.yml -f tag=<tag>`.
  mcp-registry:
    needs: goreleaser
    if: ${{ !cancelled() && needs.goreleaser.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}
