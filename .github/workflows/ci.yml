name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push supersedes the in-flight check for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # make check took 14m50s on 2026-10-10 (go test -race ./... alone ~11m,
    # internal/console the long pole at ~9m), and the next run was cut off
    # 12ms after printing "check: all green". This caps a hung job, so it
    # leaves headroom over a normal run rather than tracking it.
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 because `make docs-check` runs scripts/changelog.sh
      # --check, which rebuilds the changelog from every v* tag and the commit
      # ranges between them -- the default shallow, tagless checkout sees
      # neither (release.yml fetches full history for the same reason).
      # `make build` (`git rev-parse`) and `make fmt-check` (`git ls-files`)
      # also need the checkout's .git.
      # Pinned to full commit SHAs (see release.yml) so a retagged upstream
      # action cannot change what runs here; the comment is the readable
      # version and dependabot bumps both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # go-version-file reads go.mod's `toolchain` line, so the security
      # toolchain floor (go1.26.9, audit M1) is set in exactly one place.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to the version developers run locally. The MAJOR line is
      # load-bearing, not just reproducibility: .golangci.yml declares
      # `version: "2"` and the two schema generations are mutually unreadable, so
      # a binary from the other line does not lint badly -- it refuses to start,
      # and `make lint` stops being a gate rather than reporting nothing. Note
      # the /v2 in the module path; v1's path installs a v1 binary. `go install
      # pkg@version` resolves outside the current module, so this cannot touch
      # go.mod/go.sum.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `make vulncheck` requires the binary rather than skipping when it is
      # absent, so this install is what makes the known-vulnerability gate real
      # in CI. Pinned to the version developers run locally, same as
      # golangci-lint above; `pkg@version` resolves outside the module, so it
      # cannot touch go.mod/go.sum. Findings track the live vuln.go.dev DB, not
      # this pin, so a new advisory still turns CI red without a bump here.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # build + vet + fmt-check + lint + vulncheck + test-race. CGO stays enabled (the default
      # on this runner) because -race requires it; the no-CGO rule is about the
      # shipped binary's deps, not the test toolchain.
      - name: make check
        run: make check

  # `check` above stays the only full gate. This job runs the packages with
  # OS-specific code on the two OSes Linux CI cannot stand in for. Files
  # behind a windows or darwin build tag compile into the test binary only on
  # that OS: Windows file locking, the detached updater child, the job
  # self-check, the process table. Some tests run only there, for example
  # TestWindowsConstantsMatchTheOS and TestTaskArguments; `make cross-check`
  # only vets those files. Many more tests reach the OS-specific code
  # indirectly, through the data-dir lock and the update state files, and the
  # shared code meets each OS's own paths, permission bits and file
  # semantics. So this job runs whole packages, not a -run filter: a name
  # filter misses those tests, and every new test would have to be added to
  # it by hand.
  os-smoke:
    strategy:
      # Each OS reports on its own: a red Windows run must not cancel the
      # macOS run that would have shown whether the change is Windows-only.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run took about 25s on macOS and 20s on Windows (the owner's test
    # NUC, test binaries prebuilt). A cold CI run also compiles the test
    # binaries on 3-4 vCPUs and restores the setup-go cache, which is slow on
    # Windows runners. go test's own 10-minute -timeout stops a hung test;
    # this caps the whole job, setup included, far below the 6-hour default.
    timeout-minutes: 20
    defaults:
      run:
        # Git Bash on Windows, so every step below is one script on both OSes.
        shell: bash
    steps:
      # Git for Windows installs with core.autocrlf=true and the runner image
      # keeps that default, so a plain checkout hands Windows CRLF files.
      # Release binaries embed the LF bytes goreleaser checks out on Linux, and
      # `go install` builds from the LF module zip. Test those bytes. At
      # aaefd58 the results were identical either way (pre-flight on an LF
      # tree and a CRLF-converted one); this step stops a future test that
      # compares bytes from failing over line endings no shipped binary
      # contains. It runs before checkout, which reads the global config.
      - name: Keep LF line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # Same pins as `check`. The default shallow checkout is enough: these
      # tests read repo files (docs/install, .goreleaser.yaml, ...) but no git
      # history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 matches how .goreleaser.yaml builds every release binary,
      # so the OS code under test is the code that ships. On darwin, cgo would
      # replace the pure-Go os/user and net code with libc calls. It also keeps
      # the job off the runner's C toolchain.
      #
      # No -race on either OS. `check` already runs -race over every package
      # on Linux, and a data race in shared code is detected on any OS. The
      # OS-specific files this job exists for share no memory between
      # goroutines: their only goroutines reap the updater child, in
      # update_spawn_unix.go (which Linux already races) and
      # update_spawn_windows.go. On macOS -race made the same packages take
      # 86s instead of 25s locally. On Windows it needs cgo, which means
      # building with the runner's gcc (the windows-2025 image lists gcc
      # 15.2.0) instead of the CGO_ENABLED=0 build that ships.
      #
      # -count=1: setup-go caches GOCACHE, which holds test results, and that
      # cache key covers go.sum but not the runner image. A cached pass would
      # report on an older Windows or macOS build than the one this job is
      # meant to test.
      - name: go test (OS-facing packages)
        env:
          CGO_ENABLED: "0"
        run: |
          skip=
          if [ "$RUNNER_OS" = Windows ]; then
            # Tests that fail on every Windows host for a reason unrelated to
            # the OS code above, each with that reason. Delete a name when its
            # fix lands; a name left here after its fix just stays skipped.
            # Empty since the last two from the 2026-10-09 pre-flight of this
            # job (Windows 11, go1.26.9) were fixed: a Windows daemon now
            # keeps another host's POSIX paths as they are. An empty list
            # skips nothing, exactly like the macOS run.
            known_windows_failures=()
            if [ "${#known_windows_failures[@]}" -gt 0 ]; then
              skip=$(IFS='|'; printf '^(%s)$' "${known_windows_failures[*]}")
            fi
          fi
          go test -count=1 -skip "$skip" ./cmd/seamlessd ./internal/update ./internal/agentproc

  # Nothing else parses the workflows or .goreleaser.yaml before a tag push,
  # so a broken release config otherwise shows up when the release job fails
  # on a pushed tag. This job runs on every push instead of behind a path
  # filter: a path-filter action would be one more third-party dependency,
  # and the job is cheap. Each tool ran in well under a second, a cold
  # actionlint install took about 10s, and goreleaser-action downloads a
  # prebuilt binary (building goreleaser from source pulls 2.2 GB of modules).
  config-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `goreleaser check` needs a git repository; a shallow, tagless one is
      # enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cache: this job would save under the same key as `check` (same OS,
      # Go version and go.sum). It finishes first, so its small cache would
      # win the save, and `check` would then restore that cache instead of
      # its own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Pinned like golangci-lint in `check`, and bumped by hand: dependabot
      # bumps only `uses:` pins. actionlint picks up the runner's shellcheck
      # (the ubuntu-24.04 image ships 0.9.0), so `run:` scripts are
      # shellchecked too. A newer shellcheck in a later runner image can add
      # findings with no repo change.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      # The same action, pin and version range as release.yml, so this checks
      # the config with the goreleaser the next tag would release with. An
      # exact pin here would validate a binary the release never runs. As a
      # result, a goreleaser release that rejects the config turns this job
      # red with no repo change; the next tag would have failed the same way.
      # It needs no secrets: the notarize block is disabled when
      # MACOS_SIGN_P12 is unset, and check does not sign anything.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: check
