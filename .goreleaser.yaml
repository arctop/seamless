# goreleaser config: cross-compiled release binaries for tagged versions.
# Triggered by .github/workflows/release.yml on a v* tag, which leaves the
# release a draft until the owner has signed it (release.draft); dry-run
# locally with `make release-snapshot`. The version comes from the git tag
# (leading v stripped), injected as main.version -- see cmd/seamlessd/main.go.
#
# goreleaser builds linux and windows. The darwin binaries are built, signed
# with the project's Developer ID Application certificate and notarized on the
# owner's Mac before the tag is pushed (scripts/release/macos.sh), from THIS
# file's builds and archive: cmd/releasekit reads both and refuses any key it
# does not implement, so the two halves cannot drift. They reach the release
# as the tag's draft, and release.yml holds them to the manifest in the signed
# tag before checksum.extra_files below lists them.
version: 2

project_name: seamless

builds:
  # No CGO anywhere (pure-Go SQLite), so plain cross-compilation covers every
  # target. Windows joins linux: Claude Code hooks use exec form,
  # Codex hooks carry a command_windows override, and the daemon runs under a
  # per-user Scheduled Task. The public Codex compatibility matrix distinguishes
  # this release/syntax coverage from a live Codex-on-Windows verification.
  # goreleaser appends .exe automatically for the windows targets. darwin is
  # not in goos: releasekit builds these same entries for darwin, for every
  # goarch listed, and refuses a build that names darwin here.
  - id: seamlessd
    main: ./cmd/seamlessd
    binary: seamlessd
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # main.distribution=release is stamped HERE AND NOWHERE ELSE: it is what
    # marks a binary as a published release to the background update check,
    # which only then checks GitHub by default, keeps update state, and (in a
    # later phase) may update itself. make install, go install, CI and the
    # fixtures stay "source" (constraint dev-and-fixture-daemons-never-self-update).
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildDate={{ .Date }}
      - -X main.distribution=release
    mod_timestamp: "{{ .CommitTimestamp }}"

  # seam has no link-time metadata: both binaries ship from one tag and one
  # commit, so a version stamped into seam could only ever repeat seamlessd's or
  # contradict it. `seam version` asks the running daemon instead, which is also
  # the only thing that can report what is actually running.
  - id: seam
    main: ./cmd/seam
    binary: seam
    env:
      - CGO_ENABLED=0
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

# No notarize block: the darwin binaries are signed and notarized on the
# owner's Mac (scripts/release/macos.sh), with the hardened runtime and a
# secure timestamp, before they are archived. Why it matters:
# - macOS Background Task Management keys a LaunchAgent's item to its binary's
#   signing identity. An adhoc-signed binary is a new item on every update,
#   which posts a "seamlessd can run in the background" notice each time; only
#   a Team ID identity stays the same (lab detached-updater-os-spikes).
# - Notarized binaries pass Gatekeeper when they are quarantined. The Homebrew
#   cask's quarantine strip (cmd/releasekit/cask.go) stays as a fallback for
#   the cases notarization does not cover.

# One archive per platform holding both binaries, plus the files a fresh
# install needs: the example config `make install` seeds from, and the portable
# Claude Code/Codex skills embedded by seamlessd. They are also bundled as
# ordinary skill packages so a release archive is self-describing and supports
# manual installation without a clone. releasekit packs the darwin archives
# from this entry too (name_template and files; formats must stay tar.gz).
archives:
  - formats: [tar.gz]
    # zip on Windows: the PowerShell installer (docs/install.ps1) uses
    # Expand-Archive, and .tar.gz is not a native Windows format. Everything
    # else stays tar.gz.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - seamless.yaml.example
      - src: internal/skills/assets/seam-onboard/SKILL.md
        dst: seam-onboard
        strip_parent: true
      - src: internal/skills/assets/seam-onboard/agents/openai.yaml
        dst: seam-onboard/agents
        strip_parent: true
      - src: internal/skills/assets/seam-research/SKILL.md
        dst: seam-research
        strip_parent: true
      - src: internal/skills/assets/seam-research/agents/openai.yaml
        dst: seam-research/agents
        strip_parent: true

checksum:
  name_template: checksums.txt
  # The macOS assets: both darwin archives and the Touch ID approver
  # (seamless-approve_<version>_darwin.zip), which scripts/release/macos.sh
  # built, signed and notarized on the owner's Mac and uploaded to the tag's
  # draft release. release.yml downloads them, holds each to the sha256 the
  # signed tag's manifest gives (releasekit check-darwin), and sets
  # DARWIN_ASSETS to a glob over the checked copies. Listed here so
  # checksums.txt -- the file cosign signs below -- vouches for them like
  # every archive; the installers, the updater and `seam touchid enroll`
  # check them against those lines. They are NOT in release.extra_files: the
  # draft already holds them, and the release must hold one copy of each. A
  # fork whose tag carries no manifest leaves DARWIN_ASSETS unset, the glob
  # renders empty, and goreleaser skips the entry ("ignoring empty glob"):
  # that release has no darwin archives.
  extra_files:
    - glob: '{{ envOrDefault "DARWIN_ASSETS" "" }}'
    # The installer scripts, by the names they are released under
    # (release.extra_files below): the owner signs checksums.txt
    # (checksums.txt.sshsig, scripts/release/sign.sh), and an updater that
    # holds releases to the owner's keys (update.release_signers) runs a
    # release's installer only when these lines vouch for it, so the script
    # it pipes to a shell is covered by the owner's signature too.
    - glob: docs/install
      name_template: install
    - glob: docs/install.ps1
      name_template: install.ps1

# Sign checksums.txt so it proves AUTHENTICITY, not just integrity.
#
# Every archive is verified against checksums.txt by both installers, so
# checksums.txt is the root of that trust -- and until now it was fetched from
# the same origin as the archives with nothing binding it to this project. An
# attacker who could publish a release or MITM the host could swap the tarball
# and the manifest together and every checksum would still match (audit M3).
#
# Keyless (Sigstore): the signing identity is this repository's release workflow,
# proven by the GitHub OIDC token, and the short-lived certificate is logged in
# the public transparency log. There is no private key to generate, store as a
# secret, rotate, or leak -- which is the whole reason to prefer it here, since
# the alternative is a single maintainer holding a long-lived key.
#
# Two entries sign it -- two independent keyless signatures, one per format --
# because two kinds of verifier read it. goreleaser uploads every file an
# entry names in signature: or certificate: as a release asset.
#
#   checksum-detached: checksums.txt.sig + checksums.txt.pem, the pair
#     docs/install and docs/install.ps1 hand to `cosign verify-blob`. Never
#     rename either: an installer that cannot fetch the pair takes the release
#     for one that predates signing and falls back to checksum-only with a
#     warning instead of failing. cosign v3 deprecates these outputs and by
#     default writes only a bundle, which is why release.yml pins v2.
#   checksum-bundle: checksums.txt.sigstore.json, a Sigstore bundle
#     (certificate, signature and Rekor entry in one file) for in-process
#     sigstore-go verification against this tag's EXACT identity, so an older
#     release's signed checksums.txt cannot pass as this one's. The certificate
#     rides inside the bundle, so this entry sets no certificate, and its
#     signature names the bundle file: the ${artifact}.sig default would land
#     on the detached entry's signature. --new-bundle-format=true is
#     load-bearing: without it cosign v2 writes its legacy bundle JSON, which
#     sigstore-go cannot read.
#
# Every release from now on ships both: updating to a release, or rolling back
# to it, needs its bundle. release.yml re-verifies both from the published
# release once goreleaser exits.
#
# Requires `id-token: write` on the release job and the cosign binary; both are
# wired in .github/workflows/release.yml. Local `make release-snapshot` passes
# --skip=sign, because keyless signing off a CI runner would try to open a
# browser for an interactive OIDC flow.
signs:
  - id: checksum-detached
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
  - id: checksum-bundle
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - "--new-bundle-format=true"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# The canonical installer scripts and their Sigstore bundles ride along as
# release assets so `seamlessd update` can fetch script + signature from one
# immutable, atomically published origin and verify (via the sigstore-go
# verifier compiled into the daemon) before piping anything to a shell (audit
# M3). The bundles are produced by the "Sign installer scripts" step in
# release.yml, which runs before goreleaser; humans keep using the
# thereisnospoon.org one-liners, which serve the same bytes.
release:
  extra_files:
    - glob: docs/install
    - glob: docs/install.ps1
    - glob: sigs/install.sigstore.json
    - glob: sigs/install.ps1.sigstore.json
  # The release is the draft scripts/release/macos.sh created for the tag,
  # holding the macOS assets; goreleaser finds it by its title (the tag) and
  # uploads the rest. The draft's placeholder notes are replaced with the
  # changelog. A fork with no draft gets a new one.
  use_existing_draft: true
  mode: replace
  # goreleaser leaves the release a draft. The owner then signs its
  # checksums.txt with a hardware key (scripts/release/sign.sh uploads
  # checksums.txt.sshsig), and release.yml's publish job publishes the draft
  # only once that signature verifies against release_signers (releasekit
  # verify-owner). A fork's publish job publishes it at once.
  draft: true
  # A tag with a semver prerelease suffix (v0.7.0-rc.1) publishes as a GitHub
  # prerelease; a plain vX.Y.Z publishes as a normal release. The update check
  # skips prereleases, and GitHub's /releases/latest (what both installers
  # resolve when no SEAMLESS_VERSION is pinned) never points at one, so a
  # release candidate reaches only someone who pins it. The same flag is the
  # bad-release lever: marking a published release prerelease by hand pulls it
  # from both (the yank). The Homebrew cask is a separate push and has to be
  # reverted in the tap.
  prerelease: auto

# No homebrew_casks block: the cask (`brew install arctop/tap/seamless`, on
# macOS and Linux) is rendered from the published release's checksums.txt and
# pushed to arctop/homebrew-tap with the owner's own login
# (scripts/release/cask.sh, cmd/releasekit/cask.go), so this workflow holds
# no token for the tap. A prerelease gets no cask.

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^chore'
      - '^ci'
      - '^test'
