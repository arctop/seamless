# The documentation site's information architecture: section order, page order,
# and nothing else. docsgen cross-validates this against docs-src/ in both
# directions -- a page listed here but missing on disk, or present on disk but
# unlisted, is a build error -- so the nav and the tree cannot drift apart.
#
# `pages` are markdown paths relative to the section's `slug`, in nav order.
# A section with a slug gets a generated card-grid index at /docs/<slug>/ unless
# it lists its own <slug>/index.md; an authored index still gets the card grid,
# appended after its prose. Underscore-prefixed paths (_tools/) are generator
# partials, not pages, and are not listed here.
sections:
  - title: Getting started
    slug: ""
    description: Install with one command, connect Claude Code, the Claude app, or Codex, and watch the first briefing land.
    pages:
      - index.md
      - quickstart.md
      - first-prompts.md
      - claude-code.md
      - claude-app.md
      - codex-cli.md
      - install.md
      - updating.md
      - changelog.md

  - title: Concepts
    slug: concepts
    description: How the pieces fit - memory with a lifecycle, ambient sessions, recall, tasks, scope, and the gardener.
    pages:
      - index.md
      - how-it-works.md
      - memory.md
      - sessions.md
      - recall.md
      - tasks-and-plans.md
      - projects.md
      - project-isolation.md
      - gardener.md
      - memory-supersession.md
      - lease-based-task-claiming.md
      - reciprocal-rank-fusion.md
      - coordination-substrate.md

  - title: Guides
    slug: guides
